name: CI

# `main` is production. A merge here publishes to https://synproconsulting.co within
# roughly a minute — there is no staging environment. Every blocking job below must
# pass before the auto-merger will merge anything.

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - main
  # Lets the owner re-run the pipeline (and therefore the Pages deploy) by hand after
  # switching Settings → Pages → Source to "GitHub Actions". See SWEB-4.
  workflow_dispatch:

# Least privilege by default. The deploy job widens this for itself only.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # BLOCKING: build, format, links
  # The auto-merge job below gates on exactly these three job ids. Renaming a job
  # here without updating that `needs:` list means the auto-merger either merges on
  # nothing or blocks forever.
  # ---------------------------------------------------------------------------

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      # AD-9 / Hard Rule: GitHub Pages resolves the custom domain from a CNAME file
      # in the *published artifact*, not the repo root. If CNAME is ever missing from
      # the build output, synproconsulting.co silently reverts to unconfigured and the
      # site goes down. This assertion is the tripwire for that failure mode.
      - name: Assert CNAME survived the build (AD-9)
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "::error::dist/CNAME is missing. Publishing this artifact would unconfigure synproconsulting.co."
            exit 1
          fi
          actual="$(tr -d '[:space:]' < dist/CNAME)"
          if [ "$actual" != "synproconsulting.co" ]; then
            echo "::error::dist/CNAME contains '${actual}', expected 'synproconsulting.co'."
            exit 1
          fi
          echo "dist/CNAME verified: ${actual}"

      # SWEB-16. The gradient "coming soon" needs `-webkit-background-clip: text` on
      # engines that do not support the unprefixed property. Lightning CSS 1.33.0 —
      # which is what `cssMinify: true` selects by default — strips that prefix while
      # keeping `-webkit-text-fill-color: transparent`, and the text renders invisible.
      #
      # Chrome cannot catch this: it supports the unprefixed property, so a
      # screenshot-based check passes while the site is broken elsewhere. Hence a
      # source assertion. The failing shape is specifically the ORPHAN — text-fill-color
      # present with no background-clip prefix to pair with it.
      - name: Assert the -webkit gradient-text pairing survived the build (SWEB-16)
        run: |
          if grep -q -- '-webkit-text-fill-color' dist/index.html; then
            if ! grep -q -- '-webkit-background-clip' dist/index.html; then
              echo "::error::dist/index.html has -webkit-text-fill-color with no -webkit-background-clip. The gradient text will be invisible on engines without unprefixed background-clip. A CSS minifier has stripped the prefix — see cssMinify in astro.config.mjs (SWEB-16)."
              exit 1
            fi
            echo "gradient-text pairing verified: -webkit-background-clip present alongside -webkit-text-fill-color"
          else
            echo "no -webkit-text-fill-color in output; nothing to pair. Check skipped."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  links:
    name: links
    runs-on: ubuntu-latest
    # Checks the exact artifact that would be published, rather than a second build.
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # scripts/check-links.mjs serves ./dist over 127.0.0.1 and checks EVERY built page
      # as an explicit starting point (SWEB-30). Crawling outward from `/` alone reached
      # only the placeholder, because nothing links to the content pages until the
      # cutover PR adds navigation — it passed having scanned 5 links and could not have
      # failed on a broken reference anywhere else.
      #
      # The route list is derived from dist/ at run time, so a page added later is
      # covered the day it exists. .linkinatorrc.json still skips absolute external URLs,
      # so a third-party outage can never fail a blocking check while a genuinely broken
      # internal link still does. Negative-tested in SWEB-30: a deliberately broken
      # reference exits 1 and names the referring page.
      - run: npm run links

  # ---------------------------------------------------------------------------
  # NON-BLOCKING: deploy
  # ---------------------------------------------------------------------------

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # This job publishes what visitors actually see. As of Sprint 1 (SWEB-6) it
    # succeeds, and https://synproconsulting.co is served from this artifact — the
    # Sprint 1 prediction that it would fail until a manual source switch was wrong;
    # actions/configure-pages@v6 published on the first run.
    #
    # Caveat worth knowing before you touch this: GET /repos/.../pages still reports
    # `build_type: legacy` with `source: main/`. Serving comes from the artifact, but
    # the stored setting disagrees. Because of that, GitHub also runs its own stock
    # "pages build and deployment" (Jekyll) workflow on every push to main, and it
    # fails — pre-existing since before Sprint 1, not caused by anything here, and
    # harmless because it never produces an artifact. Setting Settings → Pages →
    # Source to "GitHub Actions" retires it and removes the red run.
    #
    # It stays continue-on-error so it can never block the auto-merger (AD-6) — which
    # per AD-6's own consequence note means it can also fail unnoticed. Check it at
    # every sprint closeout.
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------------
  # MANAGER AGENT: rule-based auto-merger
  # Ported from synproconsulting/Fracttal-PRM .github/workflows/ci.yml.
  # Adapted: gates on this repo's three blocking jobs instead of `test`.
  # ---------------------------------------------------------------------------

  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    # THE BLOCKING CHECK LIST. Must match the job ids above exactly.
    needs: [build, format, links]
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Find and merge PR
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::PAT_TOKEN secret is not set on this repository. The auto-merger cannot merge."
            echo "Add it under Settings → Secrets and variables → Actions (classic PAT, repo + workflow scope)."
            exit 1
          fi

          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          PR_NUMBER=$(curl -s \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH_NAME}" \
            | python3 -c "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')")

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $BRANCH_NAME"
            exit 0
          fi

          echo "Found PR #$PR_NUMBER — merging at SHA $GITHUB_SHA"
          # Pass {sha: $GITHUB_SHA} so the merge is refused (409) if the PR head
          # has advanced beyond the SHA this CI run actually tested.
          # Resolves FPRM-36 race: ensures we only merge code that passed CI here.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -d "{\"merge_method\": \"squash\", \"sha\": \"$GITHUB_SHA\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Merged PR #$PR_NUMBER"
          elif [ "$HTTP_CODE" = "409" ]; then
            echo "Merge refused (409): PR head has advanced past $GITHUB_SHA. A newer commit will trigger its own CI run."
            exit 0
          else
            echo "Merge failed with HTTP $HTTP_CODE"
            exit 1
          fi
